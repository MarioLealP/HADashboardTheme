name: Build and Deploy Endfield Dashboard

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Push Docker Image
        run: |
          cd endfield-dashboard
          docker build -t localhost:5000/endfield-dashboard:latest .
          docker push localhost:5000/endfield-dashboard:latest
