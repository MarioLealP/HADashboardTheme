services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: endfield-jenkins
    restart: unless-stopped
    user: root # Run as root inside container so it can write to shared volume without permission issues
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - dashboard_web_root:/var/www/endfield-dashboard

  nginx:
    image: nginx:alpine
    container_name: endfield-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - dashboard_web_root:/var/www/endfield-dashboard:ro
      - ./endfield-dashboard.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - jenkins

volumes:
  jenkins_home:
  dashboard_web_root:
